name: Full Validation Suite

on:
  schedule:
    # Execute every Sunday at 18:00 UTC (= Monday at 03:00 AM JST)
    - cron: "0 18 * * 0"
  # Manual runs validate the branch selected in "Use workflow from"; scheduled runs validate develop.
  workflow_dispatch:

jobs:
  full-tests:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"
          - platform: "windows-latest"

    runs-on: ${{ matrix.platform }}
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Checkout merged branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb nasm

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\vcpkg\archives' || '~/.cache/vcpkg/archives' }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('src-tauri/vcpkg.json', 'src-tauri/triplets/**') }}

      - name: Build libdav1d with vcpkg
        working-directory: src-tauri
        run: vcpkg install --triplet rookreader-static

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "cache-for-build-app-actions"
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Run biome check
        run: npm run check

      - name: Check wiki pages against the code
        run: npm run check:wiki

      - name: Generate third-party licenses
        run: npm run licenses

      - name: Run cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check generated TypeScript bindings are up to date
        run: npm run gen:bindings:check

      - name: Run tests
        run: npm run test

      - name: Run e2e tests on ubuntu
        if: matrix.platform == 'ubuntu-latest'
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Run e2e tests on windows
        if: matrix.platform == 'windows-latest'
        run: npm run test:e2e
