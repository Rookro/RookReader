name: Release

on:
  workflow_dispatch: # for debugging
  push:
    branches:
      - main

jobs:
  publish-release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"
          - platform: "windows-latest"

    runs-on: ${{ matrix.platform }}
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Checkout merged branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb nasm

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\vcpkg\archives' || '~/.cache/vcpkg/archives' }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('src-tauri/vcpkg.json', 'src-tauri/triplets/**') }}

      - name: Build libdav1d with vcpkg
        working-directory: src-tauri
        run: vcpkg install --triplet rookreader-static

      - name: Install frontend dependencies
        run: npm ci

      - name: Run biome check
        run: npm run check

      - name: Generate third-party licenses
        run: npm run licenses

      - name: Check generated TypeScript bindings are up to date
        run: npm run gen:bindings:check

      - name: Run tests
        run: npm run test

      - name: Run e2e tests on ubuntu
        if: matrix.platform == 'ubuntu-latest'
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Run e2e tests on windows
        if: matrix.platform == 'windows-latest'
        run: npm run test:e2e

      - name: Generate Release Body
        id: generate-release-body
        run: npm run release:body

      - name: Build and create a draft Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: ${{ steps.generate-release-body.outputs.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false

  sync-wiki:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout application repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout wiki repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          # The token is needed for the push below; GITHUB_TOKEN may write the wiki of this repository.
          persist-credentials: true

      - name: Copy docs/wiki into the wiki checkout
        run: rsync -a --delete --exclude .git docs/wiki/ wiki/

      - name: Commit and push
        working-directory: wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "docs(wiki): sync from ${GITHUB_SHA}"
          git push
