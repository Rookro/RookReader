name: Build application

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-application:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"
          - platform: "windows-latest"

    runs-on: ${{ matrix.platform }}
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Checkout merged branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "cache-for-build-app-actions"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run biome check
        run: npm run check

      - name: Generate third-party licenses
        run: npm run licenses

      - name: Run cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check generated TypeScript bindings are up to date
        run: npm run gen:bindings:check

      - name: Run tests
        run: npm run test

      - name: Run e2e tests (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Build and upload artifacts.
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          uploadWorkflowArtifacts: true
          # tauri.conf.json enables updater artifacts, which cannot be built
          # without the signing key. PR builds must not have that key.
          args: '--config {"bundle":{"createUpdaterArtifacts":false}}'
